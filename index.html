<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herzlichen Glückwunsch, lieber Heinz! – Geburtstagsquiz zum 80.</title>
<style>
  /* ===================================================================
     1) DESIGN-VARIABLEN (:root)
     Zentrale Farben und Abstände. Wer das Aussehen anpassen möchte,
     ändert am besten nur hier.
     =================================================================== */
  :root{
    /* --- Farben --- */
    --blau-dunkel:#0f5a73;   /* dunkles Wasserblau (Überschriften, Verläufe) */
    --blau:#0e7490;          /* Wasserblau, Bodensee-Bezug (Hauptfarbe) */
    --blau-hell:#38bdf8;     /* helles Blau (Akzente, Hover) */
    --gelb:#f5b301;          /* Sonnengelb (Verzierungen, Akzente) */
    --gelb-dunkel:#d99a00;   /* dunkles Gelb (Text auf hellem Grund) */
    --creme:#fbf8f2;         /* heller Hintergrundton */
    --sand:#f2ead8;          /* etwas kräftigerer Hintergrundton */
    --text:#1f2d33;          /* Grundtextfarbe */
    --text-leicht:#5b6b72;   /* dezenter Text (Unterzeilen) */
    --weiss:#ffffff;
    --gruen:#15803d;         /* richtige Antwort */
    --gruen-bg:#e7f6ec;
    --rot:#c2410c;           /* gewählte falsche Antwort (freundlich, nicht grell) */
    --rot-bg:#fdece4;
    --schatten:0 10px 30px rgba(15,90,115,0.10);  /* weicher Kartenschatten */

    /* --- Abstände / Radien (wiederkehrend) --- */
    --radius-karte:22px;     /* Eckenradius der großen Karten */
    --radius-button:14px;    /* Eckenradius der Buttons */
    --radius-gutschein:20px; /* Eckenradius der Gutscheine */
    --abstand-block:1.4rem;  /* Standardabstand zwischen Blöcken */
    --seite-max:680px;       /* maximale Breite des Inhalts */
    --button-hoehe:54px;     /* Mindesthöhe der Buttons */
  }

  /* ===================================================================
     2) GRUNDLAYOUT (Body, Seite, Bildschirme)
     =================================================================== */
  *{ box-sizing:border-box; }

  html{
    /* Angenehme, gut lesbare Grundgröße – nicht überdimensioniert */
    font-size:17px;
  }

  body{
    margin:0;
    font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(56,189,248,0.12), transparent 60%),
      linear-gradient(180deg, var(--creme) 0%, var(--sand) 100%);
    color:var(--text);
    min-height:100vh;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  .seite{
    max-width:var(--seite-max);
    margin:0 auto;
    padding:2rem 1.2rem 4rem 1.2rem;
  }

  /* Bildschirme werden per JavaScript ein-/ausgeblendet */
  .screen{ display:none; animation:einblenden 0.45s ease; }
  .screen.aktiv{ display:block; }

  @keyframes einblenden{
    from{ opacity:0; transform:translateY(12px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .screen{ animation:none; }
  }

  /* ===================================================================
     3) TYPOGRAFIE UND KARTEN
     =================================================================== */
  h1{
    font-size:1.7rem;
    font-weight:800;
    letter-spacing:-0.01em;
    color:var(--blau-dunkel);
    line-height:1.25;
    margin:0 0 1rem 0;
  }

  h2{
    font-size:1.35rem;
    font-weight:700;
    color:var(--text);
    margin:0 0 1.4rem 0;
    line-height:1.35;
  }

  p{ font-size:1rem; margin:0 0 1rem 0; }
  p:last-child{ margin-bottom:0; }

  .karte{
    background:var(--weiss);
    border-radius:var(--radius-karte);
    padding:2rem 1.8rem;
    box-shadow:var(--schatten);
    border:1px solid rgba(15,90,115,0.06);
  }

  /* ===================================================================
     4) BUTTONS
     =================================================================== */
  button{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:600;
    min-height:var(--button-hoehe);
    padding:0.8rem 1.4rem;
    border-radius:var(--radius-button);
    border:none;
    cursor:pointer;
    width:100%;
    transition:transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease;
  }
  button:active{ transform:translateY(1px) scale(0.995); }
  button:focus-visible{
    outline:3px solid var(--blau);
    outline-offset:3px;
  }

  .primaer-button{
    background:linear-gradient(135deg, var(--blau) 0%, var(--blau-dunkel) 100%);
    color:var(--weiss);
    font-size:1.15rem;
    box-shadow:0 8px 20px rgba(14,116,144,0.28);
    margin-top:1.6rem;
  }
  .primaer-button:hover{ box-shadow:0 10px 26px rgba(14,116,144,0.36); }

  /* Zweitrangiger Button (z. B. "Weitermachen") – dezenter als der Hauptbutton */
  .sekundaer-button{
    background:transparent;
    color:var(--blau-dunkel);
    border:2px solid var(--blau);
    margin-top:0.9rem;
  }
  .sekundaer-button:hover{ background:rgba(14,116,144,0.06); }

  /* ===================================================================
     5) STARTBILDSCHIRM
     =================================================================== */
  .start-karte{
    position:relative;
    text-align:center;
    overflow:hidden;
  }

  /* Dezentes "80" als Wasserzeichen im Hintergrund der Karte */
  .start-karte .wasserzeichen{
    position:absolute;
    top:-2.5rem;
    right:-1rem;
    font-size:13rem;
    font-weight:800;
    line-height:1;
    color:rgba(14,116,144,0.06);
    pointer-events:none;
    user-select:none;
    z-index:0;
  }
  /* Alle Inhalte über das Wasserzeichen legen */
  .start-karte > *:not(.wasserzeichen){ position:relative; z-index:1; }

  /* Optionaler Foto-Platzhalter (rund, mit dezentem Rahmen) */
  .start-foto{
    width:130px;
    height:130px;
    border-radius:50%;
    object-fit:cover;
    margin:0 auto 1.4rem auto;
    display:block;
    border:4px solid var(--weiss);
    box-shadow:0 6px 18px rgba(15,90,115,0.18), 0 0 0 2px rgba(245,179,1,0.5);
  }

  /* Große, elegante "80" als Blickfang über der Überschrift */
  .start-achtzig{
    font-size:4.2rem;
    font-weight:800;
    line-height:1;
    letter-spacing:-0.02em;
    background:linear-gradient(135deg, var(--gelb-dunkel), var(--blau));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin:0.4rem 0 0.2rem 0;
  }

  /* Schlichtes Ornament / Zierlinie über der Überschrift */
  .zierlinie{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0.7rem;
    color:var(--gelb-dunkel);
    margin:0.2rem 0 1rem 0;
  }
  .zierlinie::before,
  .zierlinie::after{
    content:"";
    height:2px;
    width:52px;
    background:linear-gradient(90deg, transparent, var(--gelb));
    border-radius:2px;
  }
  .zierlinie::after{
    background:linear-gradient(90deg, var(--gelb), transparent);
  }
  .zierlinie span{ font-size:1.1rem; }

  /* Kleinere, kursive Zeile unter der Hauptüberschrift */
  .start-unterzeile{
    font-size:1.15rem;
    font-style:italic;
    color:var(--text-leicht);
    margin:0.3rem 0 1.4rem 0;
  }

  /* Kleine Orientierungszeile direkt vor dem Start-Button */
  .start-hinweis{
    font-size:0.95rem;
    font-weight:600;
    color:var(--blau-dunkel);
    margin:1.6rem 0 0 0;
  }

  /* Dezente Absenderzeile unter den Buttons */
  .start-absender{
    font-size:0.85rem;
    color:var(--text-leicht);
    margin:1rem 0 0 0;
  }

  /* ===================================================================
     6) QUIZ (Fortschritt, Frage, Antworten, Feedback)
     =================================================================== */
  .fortschritt{
    display:flex;
    align-items:center;
    gap:0.9rem;
    margin-bottom:1.4rem;
  }
  .fortschritt-balken-aussen{
    flex:1;
    background:rgba(15,90,115,0.10);
    border-radius:999px;
    height:10px;
    overflow:hidden;
  }
  .fortschritt-balken-innen{
    background:linear-gradient(90deg, var(--blau), var(--gelb));
    height:100%;
    width:0;
    border-radius:999px;
    transition:width 0.45s ease;
  }
  .fortschritt-text{
    font-size:0.9rem;
    font-weight:600;
    color:var(--text-leicht);
    white-space:nowrap;
  }

  /* Jahrzehnt-Kennzeichnung über der Frage */
  .jahrzehnt-label{
    display:inline-flex;
    align-items:center;
    gap:0.4rem;
    background:linear-gradient(135deg, rgba(245,179,1,0.18), rgba(245,179,1,0.28));
    color:var(--gelb-dunkel);
    font-weight:700;
    padding:0.35rem 0.9rem;
    border-radius:999px;
    font-size:0.85rem;
    letter-spacing:0.02em;
    text-transform:uppercase;
    margin-bottom:1rem;
  }

  /* Antwort-Buttons */
  #antworten-liste{ display:flex; flex-direction:column; gap:0.7rem; }

  .antwort-button{
    text-align:left;
    background:var(--creme);
    color:var(--text);
    border:2px solid rgba(15,90,115,0.14);
    font-weight:500;
  }
  .antwort-button:hover:not(:disabled){
    border-color:var(--blau-hell);
    background:#fff;
  }
  .antwort-button.richtig{
    background:var(--gruen-bg);
    border-color:var(--gruen);
    color:var(--gruen);
    font-weight:700;
  }
  .antwort-button.falsch{
    background:var(--rot-bg);
    border-color:var(--rot);
    color:var(--rot);
  }
  .antwort-button:disabled{ cursor:default; }

  /* Feedback-Bereich nach der Antwort */
  .feedback{
    margin-top:1.4rem;
    padding:1.2rem 1.3rem;
    border-radius:16px;
    background:linear-gradient(135deg, rgba(14,116,144,0.06), rgba(245,179,1,0.08));
    border:1px solid rgba(14,116,144,0.15);
  }
  .feedback p{ margin-bottom:0; }
  .feedback strong{ color:var(--blau-dunkel); }

  /* ===================================================================
     7) ABSCHLUSS: Gruß, Konfetti
     =================================================================== */
  .konfetti{
    position:fixed;
    top:-20px;
    width:10px;
    height:10px;
    border-radius:2px;
    opacity:0.9;
    animation:falle 4.5s linear infinite;
    z-index:1;
    pointer-events:none;
  }
  @keyframes falle{
    0%   { transform:translateY(0) rotate(0deg); }
    100% { transform:translateY(110vh) rotate(360deg); }
  }
  /* Bewegungsanimation nur bei aktivierter Bewegung */
  @media (prefers-reduced-motion: reduce){
    .konfetti{ display:none; }
  }

  .gruss-text{ color:var(--text); }
  .gruss-text .anrede{ font-weight:700; color:var(--blau-dunkel); }

  /* ===================================================================
     8) GUTSCHEINE (Bodensee-Farbwelt: Wasserblau + Sonnengelb)
     =================================================================== */
  .gutschein{
    position:relative;
    border-radius:var(--radius-gutschein);
    padding:1.8rem 1.6rem;
    margin:1.4rem 0;
    color:var(--weiss);
    overflow:hidden;
    box-shadow:0 12px 28px rgba(15,90,115,0.22);
  }
  .gutschein.reise{
    background:linear-gradient(135deg, #0e7490 0%, #0f5a73 60%, #0b4257 100%);
  }
  .gutschein.essen{
    background:linear-gradient(135deg, #1789a8 0%, #0e7490 60%, #0f5a73 100%);
  }
  /* Dezente Sonnengelb-Verzierung in der Ecke */
  .gutschein::after{
    content:"";
    position:absolute;
    top:-40px; right:-40px;
    width:140px; height:140px;
    background:radial-gradient(circle, rgba(245,179,1,0.55), transparent 70%);
    border-radius:50%;
  }

  .gutschein-marke{
    display:inline-block;
    font-size:0.75rem;
    font-weight:700;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gelb);
    margin-bottom:0.4rem;
  }
  .gutschein-titel{
    font-size:1.4rem;
    font-weight:800;
    margin:0 0 0.7rem 0;
    position:relative;
    z-index:1;
  }
  .gutschein-beschreibung{
    font-size:0.98rem;
    color:rgba(255,255,255,0.92);
    position:relative;
    z-index:1;
  }
  .gutschein-info{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:0.4rem;
    font-size:0.82rem;
    color:rgba(255,255,255,0.75);
    border-top:1px solid rgba(255,255,255,0.25);
    padding-top:0.9rem;
    margin-top:1.2rem;
  }
  .gutschein-fuer{
    font-size:0.95rem;
    margin-top:1rem;
    color:rgba(255,255,255,0.92);
  }
  .gutschein-fuer strong{ color:var(--gelb); }

  .unterschriften{
    display:flex;
    justify-content:space-between;
    gap:1.2rem;
    flex-wrap:wrap;
    margin-top:1.6rem;
    position:relative;
    z-index:1;
  }
  .unterschrift{
    flex:1 1 200px;
    text-align:center;
    border-top:1px solid rgba(255,255,255,0.5);
    padding-top:0.5rem;
    font-size:0.9rem;
    color:rgba(255,255,255,0.95);
  }

  /* Der Überraschungs-Bereich ist zunächst verborgen und wird per Klick
     eingeblendet. Auf dem Bildschirm bleiben die Gutscheine bis dahin
     unsichtbar; für den Druck werden sie weiter unten wieder erzwungen. */
  #ueberraschung{ display:none; }

  /* Verbindende Zeile zwischen den beiden Gutscheinen (dezent gesetzt) */
  .verbindungszeile{
    text-align:center;
    font-style:italic;
    color:var(--text-leicht);
    font-size:0.98rem;
    max-width:520px;
    margin:0.4rem auto;
    padding:0 0.5rem;
  }

  /* Einblend-Animation für die Gutscheine (wird per JavaScript ausgelöst) */
  .animiert{
    opacity:0;
    transform:translateY(24px);
    transition:opacity 0.7s ease, transform 0.7s ease;
  }
  .animiert.sichtbar{
    opacity:1;
    transform:translateY(0);
  }
  /* Bei reduzierter Bewegung keine Animation – sofort sichtbar */
  @media (prefers-reduced-motion: reduce){
    .animiert{ opacity:1; transform:none; transition:none; }
  }

  /* ===================================================================
     9) RESPONSIV (Smartphone)
     =================================================================== */
  @media (max-width:480px){
    html{ font-size:16px; }
    .seite{ padding:1.4rem 0.9rem 3rem 0.9rem; }
    .karte{ padding:1.5rem 1.2rem; }
    /* Auf dem Smartphone die Unterschriften untereinander, ohne Höhen-Dehnung */
    .unterschriften{ flex-direction:column; gap:0.9rem; }
    .unterschrift{ flex:0 0 auto; }
  }

  /* ===================================================================
     10) DRUCKANSICHT
     Beim Drucken sollen die Gutscheine IMMER erscheinen – auch wenn der
     Überraschungs-Button noch nicht angeklickt wurde. Jeder Gutschein
     bekommt möglichst eine eigene Seite.
     =================================================================== */
  @media print{
    body{ background:#fff !important; }
    .no-print{ display:none !important; }
    .konfetti{ display:none !important; }
    /* Nur der Abschluss-Bildschirm mit den Gutscheinen wird gedruckt */
    #screen-start, #screen-quiz{ display:none !important; }
    #screen-ende{ display:block !important; }
    #screen-ende > .karte{ display:none !important; } /* Grußkarte nicht mitdrucken */
    /* Gutscheine erzwingen, egal ob eingeblendet oder nicht */
    #ueberraschung{ display:block !important; }
    .animiert{ opacity:1 !important; transform:none !important; }
    .verbindungszeile{ page-break-inside:avoid; }
    .gutschein{
      opacity:1 !important;
      transform:none !important;
      box-shadow:none;
      color:#000 !important;
      background:#fff !important;
      border:2px solid #0e7490;
      page-break-inside:avoid;
    }
    /* Nur nach dem ersten Gutschein umbrechen, damit jeder auf einer
       eigenen Seite steht und keine leere Seite am Ende entsteht */
    #gutschein-1{ page-break-after:always; }
    /* Farbige Textstellen im Druck lesbar machen */
    .gutschein-marke{ color:#0e7490 !important; }
    .gutschein-titel, .gutschein-beschreibung, .gutschein-info,
    .gutschein-fuer, .unterschrift{ color:#000 !important; }
    .gutschein-fuer strong{ color:#0e7490 !important; }
    .unterschrift{ border-top:1px solid #000; }
    .gutschein::after{ display:none; }
  }
</style>
</head>
<body>

<div class="seite">

  <!-- ============================================================
       BILDSCHIRM 1: START
       Alle Texte werden per JavaScript aus CONFIG eingesetzt.
       ============================================================ -->
  <div id="screen-start" class="screen aktiv">
    <div class="karte start-karte">
      <!-- Dezentes "80" als Wasserzeichen im Kartenhintergrund -->
      <div class="wasserzeichen" aria-hidden="true" id="start-wasserzeichen"></div>
      <!-- Optionales Foto (wird nur angezeigt, wenn CONFIG.fotoPfad gesetzt ist) -->
      <img class="start-foto" id="start-foto" src="" alt="" style="display:none;">
      <!-- Große "80" als Blickfang -->
      <div class="start-achtzig" id="start-achtzig"></div>
      <!-- Schlichtes Ornament über der Überschrift -->
      <div class="zierlinie" aria-hidden="true"><span id="start-ornament"></span></div>
      <!-- Groß und fett -->
      <h1 id="start-ueberschrift"></h1>
      <!-- Kleiner und kursiv -->
      <div class="start-unterzeile" id="start-unterzeile"></div>
      <!-- Einleitungsabsätze -->
      <div id="start-einleitung"></div>
      <!-- Orientierungszeile -->
      <p class="start-hinweis" id="start-hinweis"></p>
      <!-- Start-Button (beginnt von vorn) -->
      <button class="primaer-button" id="start-button" onclick="starteQuiz()"></button>
      <!-- Weitermachen-Button (nur sichtbar, wenn ein Fortschritt gespeichert ist) -->
      <button id="weitermachen-button" class="sekundaer-button" style="display:none;"
              onclick="setzeQuizFort()"></button>
      <!-- Absenderzeile -->
      <p class="start-absender" id="start-absender"></p>
    </div>
  </div>

  <!-- ============================================================
       BILDSCHIRM 2: QUIZ
       ============================================================ -->
  <div id="screen-quiz" class="screen">
    <div class="fortschritt">
      <div class="fortschritt-balken-aussen">
        <div class="fortschritt-balken-innen" id="fortschritt-balken"></div>
      </div>
      <div class="fortschritt-text" id="fortschritt-text"></div>
    </div>

    <div class="karte">
      <!-- Das Jahrzehnt wird hier über der Frage angezeigt -->
      <div class="jahrzehnt-label" id="jahrzehnt-label"></div>
      <h2 id="frage-text"></h2>
      <div id="antworten-liste"></div>
      <div class="feedback" id="feedback-bereich" style="display:none;">
        <p id="feedback-text"></p>
        <button class="primaer-button" id="feedback-weiter" onclick="naechsteFrage()"></button>
      </div>
    </div>
  </div>

  <!-- ============================================================
       BILDSCHIRM 3: ABSCHLUSS
       Gruß und Gutscheine werden per JavaScript aus CONFIG erzeugt.
       ============================================================ -->
  <div id="screen-ende" class="screen">
    <div class="karte">
      <h1 id="ende-ueberschrift"></h1>
      <p class="gruss-text" id="gruss-text"></p>
    </div>

    <!-- Großer Button: erst hier werden die Gutscheine enthüllt -->
    <button id="ueberraschung-button" class="primaer-button no-print"
            onclick="zeigeUeberraschung()"></button>

    <!-- Container für die beiden Gutscheine (Inhalt kommt aus CONFIG) -->
    <div id="ueberraschung"></div>
  </div>

</div>

<script>
  // ============================================================
  //  HIER ANPASSEN — alle Inhalte an einer Stelle
  //  Unterhalb dieses Blocks muss nichts geändert werden.
  // ============================================================
  const CONFIG = {

    // --- Seitentitel (Beschriftung des Browser-Tabs) ---
    seitentitel: "Herzlichen Glückwunsch, lieber Heinz! – Geburtstagsquiz zum 80.",

    // --- Namen ---
    namen: {
      heinz:  "Heinz",
      meta:   "Meta",
      kind1:  "Jens Müller",
      kind2:  "Julia Müller-Schleppi"
    },

    // --- Eckdaten ---
    alter:             80,           // Zahl im Blickfang und Wasserzeichen
    geburtsjahr:       1946,
    ausstellungsdatum: "24.07.2026", // Datum auf den Gutscheinen

    // --- Optionales Foto (leerer Pfad = Foto ausgeblendet) ---
    fotoPfad: "",                    // z. B. "heinz.jpg" eintragen, um es zu zeigen
    fotoAlt:  "Foto von Heinz",

    // --- Startbildschirm ---
    start: {
      ornament:     "✦",
      ueberschrift: "Herzlichen Glückwunsch zum 80. Geburtstag!",
      unterzeile:   "lieber Papa, Opa und Schwiegervater",
      // Einleitung: beliebig viele Absätze (jeder Eintrag ein Absatz)
      einleitung: [
        "Lieber Heinz, zu deinem großen Ehrentag haben wir dir ein kleines Quiz zusammengestellt. Es geht um dein Geburtsjahr 1946 und die spannenden Jahrzehnte, die seitdem vergangen sind und so manches Ereignis, an das du dich vielleicht noch gut erinnerst.",
        "Am Ende wartet Eine Überraschung auf dich."
      ],
      orientierung:  "9 Fragen, ganz ohne Eile.",
      startButton:   "Los geht's!",
      weiterButton:  "Dort weitermachen, wo du aufgehört hast",
      absender:      "Von Jens, Julia und ihren Familien"
    },

    // --- Quiz-Beschriftungen ---
    quiz: {
      weiterButton:    "Weiter",
      // {nummer} und {gesamt} werden automatisch ersetzt
      fortschritt:     "Frage {nummer} von {gesamt}",
      // Feedback-Präfixe (dürfen HTML enthalten), davor bzw. danach steht die Erläuterung
      feedbackRichtig: "<strong>Genau richtig!</strong> ",
      feedbackFalsch:  "<strong>Fast!</strong> Kein Problem, hier ist die Auflösung: "
    },

    // --- Abschlussbildschirm ---
    abschluss: {

      }

      // ---------- Familienfragen ----------
      // HIER ANPASSEN — Familienfrage
      // Diese Beispiele sind bewusst auskommentiert, damit das Quiz unverändert
      // bleibt. Zum Aktivieren die Kommentarzeichen (//) entfernen und den
      // vorstehenden Fragen ein Komma anhängen. Format wie oben.
      //
      // ,{
      //   jahrzehnt: "Aus der Familie",
      //   frage: "In welchem Jahr haben Heinz und Meta geheiratet?",

      //   richtig: 1,
      //   erklaerung: "Beispieltext — hier die richtige Antwort und eine liebevolle Erinnerung eintragen."
      // },

  // ============================================================
  //  ZUSTANDSVERWALTUNG
  // ============================================================
  let aktuelleFrage = 0;                     // Index der aktuellen Frage
  let gegebeneAntworten = [];                // merkt sich die gewählten Antworten
  const SPEICHER_SCHLUESSEL = 'heinz-quiz-fortschritt';

  // ============================================================
  //  HILFSFUNKTIONEN
  // ============================================================

  // Ersetzt Platzhalter der Form {name} in einer Vorlage durch Werte
  function vorlage(text, werte){
    return text.replace(/\{(\w+)\}/g, function(_, schluessel){
      return (schluessel in werte) ? werte[schluessel] : '';
    });
  }

  // Kurzschreibweise für document.getElementById
  function el(id){ return document.getElementById(id); }

  // ============================================================
  //  BILDSCHIRM-RENDERING
  //  Setzt alle Texte aus CONFIG in die (leeren) HTML-Elemente ein.
  // ============================================================

  // Startbildschirm füllen
  function renderStart(){
    const s = CONFIG.start;
    el('start-wasserzeichen').textContent = CONFIG.alter;
    el('start-achtzig').textContent       = CONFIG.alter;
    el('start-ornament').textContent      = s.ornament;
    el('start-ueberschrift').textContent  = s.ueberschrift;
    el('start-unterzeile').textContent    = s.unterzeile;
    el('start-hinweis').textContent       = s.orientierung;
    el('start-button').textContent        = s.startButton;
    el('weitermachen-button').textContent = s.weiterButton;
    el('start-absender').textContent      = s.absender;

    // Einleitung: pro Eintrag ein Absatz
    const einl = el('start-einleitung');
    einl.innerHTML = '';
    s.einleitung.forEach(function(absatz){
      const p = document.createElement('p');
      p.textContent = absatz;
      einl.appendChild(p);
    });

    // Foto nur anzeigen, wenn ein Pfad hinterlegt ist
    const foto = el('start-foto');
    foto.alt = CONFIG.fotoAlt;
    if(CONFIG.fotoPfad){
      foto.src = CONFIG.fotoPfad;
      foto.style.display = 'block';
    }
  }

  // Abschluss-Texte (Überschrift, Gruß, Überraschungs-Button) füllen
  function renderAbschluss(){
    el('ende-ueberschrift').textContent   = CONFIG.abschluss.ueberschrift;
    el('gruss-text').innerHTML            = CONFIG.abschluss.gruss;
    el('ueberraschung-button').textContent = CONFIG.abschluss.ueberraschungButton;
  }

  // Baut das HTML für einen einzelnen Gutschein
  function gutscheinHtml(g, id){
    const t = CONFIG.gutscheinText;
    const marke  = t.markePrefix + ' · ' + g.zeit;
    const nummer = vorlage(t.nummerLabel, { nummer: g.nummer });
    const datum  = vorlage(t.datumLabel,  { datum: CONFIG.ausstellungsdatum });
    const fuer   = vorlage(t.ausgestelltFuer, { name: CONFIG.namen.heinz });
    const unterschriften = g.unterschriften.map(function(u){
      return '<div class="unterschrift">' + u + '</div>';
    }).join('');

    return '' +
      '<div class="gutschein ' + g.variante + ' animiert" id="' + id + '">' +
        '<div class="gutschein-marke">' + marke + '</div>' +
        '<div class="gutschein-titel">' + g.titel + '</div>' +
        '<p class="gutschein-beschreibung">' + g.beschreibung + '</p>' +
        '<div class="gutschein-info"><span>' + nummer + '</span><span>' + datum + '</span></div>' +
        '<p class="gutschein-fuer">' + fuer + '</p>' +
        '<div class="unterschriften">' + unterschriften + '</div>' +
      '</div>';
  }

  // Beide Gutscheine samt Verbindungszeile in den Container einsetzen
  function renderGutscheine(){
    const g = CONFIG.gutscheine;
    el('ueberraschung').innerHTML =
      gutscheinHtml(g[0], 'gutschein-1') +
      '<p class="verbindungszeile animiert" id="verbindungszeile">' + CONFIG.verbindung + '</p>' +
      gutscheinHtml(g[1], 'gutschein-2');
  }

  // Blendet den gewünschten Bildschirm ein und alle anderen aus
  function wechsleBildschirm(zielId){
    document.querySelectorAll('.screen').forEach(function(element){
      element.classList.remove('aktiv');
    });
    el(zielId).classList.add('aktiv');
    window.scrollTo(0, 0);
  }

  // ============================================================
  //  QUIZ-LOGIK
  // ============================================================

  // Startet das Quiz von vorn und löscht einen eventuell gespeicherten Stand
  function starteQuiz(){
    aktuelleFrage = 0;
    gegebeneAntworten = [];
    loescheFortschritt();
    wechsleBildschirm('screen-quiz');
    zeigeFrage();
  }

  // Setzt ein zuvor begonnenes Quiz an der gespeicherten Stelle fort
  function setzeQuizFort(){
    const stand = ladeFortschritt();
    if(stand){
      aktuelleFrage = stand.aktuelleFrage || 0;
      gegebeneAntworten = stand.gegebeneAntworten || [];
    }
    wechsleBildschirm('screen-quiz');
    zeigeFrage();
  }

  // Zeigt die aktuelle Frage inklusive Antwortmöglichkeiten an
  function zeigeFrage(){
    const daten = CONFIG.fragen[aktuelleFrage];

    // Fortschrittsanzeige aktualisieren
    el('fortschritt-text').textContent = vorlage(CONFIG.quiz.fortschritt, {
      nummer: aktuelleFrage + 1,
      gesamt: CONFIG.fragen.length
    });
    el('fortschritt-balken').style.width =
      (aktuelleFrage / CONFIG.fragen.length * 100) + '%';

    // Jahrzehnt über der Frage und Fragetext anzeigen
    el('jahrzehnt-label').textContent = daten.jahrzehnt;
    el('frage-text').textContent = daten.frage;

    // Feedback-Bereich verstecken
    el('feedback-bereich').style.display = 'none';

    // Antwort-Buttons neu aufbauen
    const liste = el('antworten-liste');
    liste.innerHTML = '';
    daten.antworten.forEach(function(antwort, index){
      const btn = document.createElement('button');
      btn.className = 'antwort-button';
      btn.textContent = antwort;
      btn.onclick = function(){ beantworten(index); };
      liste.appendChild(btn);
    });
  }

  // Wird aufgerufen, wenn eine Antwort angeklickt wurde.
  // Zeigt sofort wohlwollendes Feedback — egal ob richtig oder falsch.
  function beantworten(gewaehlterIndex){
    const daten = CONFIG.fragen[aktuelleFrage];
    const buttons = document.querySelectorAll('#antworten-liste .antwort-button');

    buttons.forEach(function(btn, index){
      btn.disabled = true;
      if(index === daten.richtig){
        btn.classList.add('richtig');
      } else if(index === gewaehlterIndex){
        btn.classList.add('falsch');
      }
    });

    // Gewählte Antwort merken und Fortschritt sichern
    gegebeneAntworten[aktuelleFrage] = gewaehlterIndex;
    speichereFortschritt();

    const warRichtig = gewaehlterIndex === daten.richtig;
    el('feedback-text').innerHTML =
      (warRichtig ? CONFIG.quiz.feedbackRichtig : CONFIG.quiz.feedbackFalsch)
      + daten.erklaerung;

    el('feedback-bereich').style.display = 'block';
  }

  // Springt zur nächsten Frage oder zum Abschluss-Bildschirm
  function naechsteFrage(){
    aktuelleFrage++;
    if(aktuelleFrage < CONFIG.fragen.length){
      speichereFortschritt();
      zeigeFrage();
    } else {
      el('fortschritt-balken').style.width = '100%';
      zeigeEnde();
    }
  }

  // Zeigt den Abschluss-Bildschirm – zunächst nur mit dem Geburtstagsgruß.
  // Die Gutscheine bleiben verborgen, bis der Überraschungs-Button geklickt wird.
  function zeigeEnde(){
    // Nach Abschluss den gespeicherten Stand zurücksetzen
    loescheFortschritt();
    wechsleBildschirm('screen-ende');
    erzeugeKonfetti();
  }

  // ============================================================
  //  GUTSCHEINE / ÜBERRASCHUNG
  // ============================================================

  // Blendet die beiden Gutscheine nacheinander sanft ein und scrollt weich
  // dorthin. Bei reduzierter Bewegung werden sie sofort und ohne Animation
  // angezeigt.
  function zeigeUeberraschung(){
    const container = el('ueberraschung');
    const button    = el('ueberraschung-button');
    const karte1 = el('gutschein-1');
    const zeile  = el('verbindungszeile');
    const karte2 = el('gutschein-2');
    const reduziert = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    button.style.display = 'none';   // Button verschwindet nach dem Klick
    container.style.display = 'block';

    if(reduziert){
      // Ohne Animation: alles direkt sichtbar
      [karte1, zeile, karte2].forEach(function(element){
        element.classList.add('sichtbar');
      });
      container.scrollIntoView({ behavior:'auto', block:'start' });
      return;
    }

    // Startzustand sicher übernehmen (Reflow erzwingen), dann einblenden
    void container.offsetWidth;
    requestAnimationFrame(function(){
      karte1.classList.add('sichtbar');
      container.scrollIntoView({ behavior:'smooth', block:'start' });
    });
    // Zweite Karte samt Verbindungszeile mit kurzer Verzögerung
    setTimeout(function(){
      zeile.classList.add('sichtbar');
      karte2.classList.add('sichtbar');
    }, 450);
  }

  // Erzeugt ein paar dezente Konfetti-Elemente für den Abschluss-Bildschirm.
  // Läuft nur, wenn der Nutzer keine reduzierte Bewegung eingestellt hat.
  function erzeugeKonfetti(){
    const reduzierteBewegung = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduzierteBewegung) return;

    const farben = ['#f5b301', '#0e7490', '#38bdf8', '#d99a00'];
    for(let i = 0; i < 26; i++){
      const stueck = document.createElement('div');
      stueck.className = 'konfetti';
      stueck.style.left = (Math.random() * 100) + 'vw';
      stueck.style.background = farben[i % farben.length];
      stueck.style.animationDelay = (Math.random() * 4) + 's';
      stueck.style.animationDuration = (3.5 + Math.random() * 2) + 's';
      document.body.appendChild(stueck);
    }
  }

  // ============================================================
  //  LOCALSTORAGE (Fortschritt speichern)
  //  localStorage kann fehlschlagen (z. B. bei file:// oder Privatmodus).
  //  Alle Zugriffe sind deshalb in try/catch gekapselt, damit das Quiz
  //  auch dann einwandfrei funktioniert.
  // ============================================================

  // Speichert den aktuellen Fortschritt
  function speichereFortschritt(){
    try{
      localStorage.setItem(SPEICHER_SCHLUESSEL, JSON.stringify({
        aktuelleFrage: aktuelleFrage,
        gegebeneAntworten: gegebeneAntworten
      }));
    }catch(e){ /* Ohne Speicher läuft das Quiz trotzdem weiter. */ }
  }

  // Liest einen gespeicherten Fortschritt aus – oder null, wenn keiner da ist
  function ladeFortschritt(){
    try{
      const daten = localStorage.getItem(SPEICHER_SCHLUESSEL);
      return daten ? JSON.parse(daten) : null;
    }catch(e){ return null; }
  }

  // Löscht den gespeicherten Fortschritt
  function loescheFortschritt(){
    try{ localStorage.removeItem(SPEICHER_SCHLUESSEL); }catch(e){ /* egal */ }
  }

  // ============================================================
  //  INITIALISIERUNG
  //  Läuft einmal beim Laden der Seite: Inhalte einsetzen und prüfen,
  //  ob ein gespeicherter Fortschritt existiert.
  // ============================================================
  (function init(){
    document.title = CONFIG.seitentitel;

    // Alle Texte aus CONFIG in die Bildschirme einsetzen
    renderStart();
    renderAbschluss();
    renderGutscheine();
    el('feedback-weiter').textContent = CONFIG.quiz.weiterButton;

    // Falls ein Fortschritt gespeichert ist, den "Weitermachen"-Button zeigen
    const stand = ladeFortschritt();
    const hatFortschritt = stand &&
      ((stand.aktuelleFrage || 0) > 0 ||
       (stand.gegebeneAntworten && stand.gegebeneAntworten.length > 0));
    if(hatFortschritt){
      el('weitermachen-button').style.display = 'block';
    }
  })();
</script>
